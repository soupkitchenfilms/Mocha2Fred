name: Release

# Push a tag like v0.1.1: this checks the version, runs the tests, builds Mocha2Fred-0.1.1.zip and attaches it to a
# GitHub Release with that version's CHANGELOG section as the notes.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Version matches the tag
        run: |
          V="${GITHUB_REF_NAME#v}"
          grep -q "^__version__ = \"$V\"" mocha_fred/fred_mocha_exporters.py || { echo "fred_mocha_exporters.__version__ is not $V"; exit 1; }
          grep -q "^## $V " CHANGELOG.md || { echo "CHANGELOG.md has no '## $V' section"; exit 1; }
      - run: python -m unittest discover -s tests
      - run: python mocha_fred/fred_blob.py --selftest
      - name: Build the zip
        run: |
          V="${GITHUB_REF_NAME#v}"
          mkdir -p "dist/Mocha2Fred-$V"
          cp -r mocha_fred README.md LICENSE NOTICE CHANGELOG.md "dist/Mocha2Fred-$V/"
          find "dist/Mocha2Fred-$V" -name "__pycache__" -prune -exec rm -rf {} +
          (cd dist && zip -qr "Mocha2Fred-$V.zip" "Mocha2Fred-$V")
          awk -v v="$V" '$0 ~ "^## "v" " {on=1; next} /^## / {on=0} on' CHANGELOG.md > dist/notes.md
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "dist/Mocha2Fred-${GITHUB_REF_NAME#v}.zip" --title "Mocha2Fred ${GITHUB_REF_NAME#v}" --notes-file dist/notes.md
